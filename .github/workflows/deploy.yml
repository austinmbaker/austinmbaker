name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # refresh Orbital Dawn posts every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # If Substack is unreachable the site still deploys with the committed
      # data/signals.json, which shows the "Read on Substack" fallback.
      - name: Pull latest Orbital Dawn posts
        run: node scripts/fetch-signals.mjs
        continue-on-error: true

      - id: pages
        uses: actions/configure-pages@v5

      # Project sites live under /<repo>/; a custom domain serves from the
      # root, where base_path is empty and this step changes nothing.
      - name: Apply base path
        run: node scripts/apply-base-path.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
